[project]
name = "householdhub-backend"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "django>=5.2,<5.3",
    "django-allauth>=65.19.7",
    "djangorestframework>=3.18.3",
    "psycopg[binary]>=3.3.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
