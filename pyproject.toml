[project]
name = "householdhub-backend"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "django>=5.2,<5.3",
    "django-allauth>=65.19.7",
    "djangorestframework>=3.18.3",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.6",
    "requests==2.19.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
    "djangorestframework-stubs>=3.18.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 120
extend-exclude = ["apps/*/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# Long prose/contract lines are accepted; no formatter is enforced.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"apps/*/admin.py" = ["F401"]

[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["^apps/[^/]+/migrations/"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.coverage.run]
source = ["apps", "config"]
branch = true
omit = ["*/migrations/*", "*/tests/*", "*/test_*.py"]

[tool.coverage.report]
show_missing = true

[[tool.mypy.overrides]]
module = ["allauth.*"]
ignore_missing_imports = true
