name: Issue 1 temporary verification
# Temporary: removed before PR.

on:
  push:
    branches:
      - feat/1-django-scaffold

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
      - name: Bootstrap lock tooling
        run: python -m pip install --upgrade "pip==26.2.1" "pip-tools==7.6.1"
      - name: Compile dependency locks
        run: |
          python -m piptools compile \
            --strip-extras \
            --output-file=/tmp/requirements.lock \
            requirements.in
          python -m piptools compile \
            --strip-extras \
            --output-file=/tmp/requirements-dev.lock \
            requirements-dev.in
          echo '===BEGIN_RUNTIME_LOCK==='
          cat /tmp/requirements.lock
          echo '===END_RUNTIME_LOCK==='
          echo '===BEGIN_DEV_LOCK==='
          cat /tmp/requirements-dev.lock
          echo '===END_DEV_LOCK==='
      - name: Upload generated locks
        uses: actions/upload-artifact@v4
        with:
          name: issue1-locks
          path: |
            /tmp/requirements.lock
            /tmp/requirements-dev.lock
      - name: Install locked dependencies
        run: python -m pip install -r /tmp/requirements-dev.lock
      - name: Dependency integrity
        run: python -m pip check
      - name: Django system check
        run: python manage.py check
      - name: Tests
        run: pytest
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy .
